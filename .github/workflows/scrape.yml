name: Mise à jour des chapitres

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes
  workflow_dispatch:         # permet aussi un lancement à la main
    inputs:
      full:
        description: 'Parcourir tout le catalogue ?'
        type: boolean
        default: false

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trouver le dossier du scraper
        id: dir
        run: |
          if [ -f scraper/package.json ]; then echo "path=scraper" >> "$GITHUB_OUTPUT"; else echo "path=." >> "$GITHUB_OUTPUT"; fi

      - name: Installer
        working-directory: ${{ steps.dir.outputs.path }}
        run: npm install --no-audit --no-fund

      - name: Lancer le scraper
        working-directory: ${{ steps.dir.outputs.path }}
        run: node run.js ${{ inputs.full && '--full' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
